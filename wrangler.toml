name = "daicho"
main = "src/worker/index.ts"
compatibility_date = "2025-09-06"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /cal/ は大文字と小文字の組み合わせも Worker に渡す (Access が区別しないため)
run_worker_first = ["/api/*", "/cal/*", "/CAL/*", "/Cal/*", "/cAl/*", "/caL/*", "/CAl/*", "/CaL/*", "/cAL/*"]

[[d1_databases]]
binding = "DB"
database_name = "daicho"
# プレースホルダです。実際の ID はここに書きません。
# 環境変数 D1_DATABASE_ID から wrangler.deploy.toml を生成します (BUILD.md の手順 2)。
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
CONTACT_MAILTO = ""
